<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">

<style>

*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'Hind Siliguri','Noto Sans Bengali','Segoe UI',sans-serif;background:var(--bgi,var(--bg));background-attachment:fixed;color:var(--ink);display:flex;font-size:15px;overflow:hidden}

.rs{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;touch-action:none}.rs:hover{background:#ffffff40}

button.b{background:var(--ac);color:#fff;border:0;cursor:pointer;padding:8px 14px}button.b.g{background:var(--panel);color:var(--ac);border:1px solid var(--ac)}button.b.r{background:var(--bad)}button.b.s{padding:4px 9px}

.t-ok{background:var(--ok)}.t-warn{background:var(--warn)}.t-bad{background:var(--bad)}
#log{max-height:200px;overflow:auto;font-size:13px;background:var(--bg);padding:10px;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.th{display:flex;gap:8px;flex-wrap:wrap}.th button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}

.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
table th{background:var(--ac);color:var(--panel)}.tw table tr:nth-child(odd):not(:first-child){background:rgba(127,127,127,.13)}.who{font-size:14px;font-weight:500;margin-left:30px;display:inline-flex;gap:28px;flex-wrap:wrap;color:var(--ac);vertical-align:middle}.pwl{position:relative}.pwl input{padding-right:38px}.eye{position:absolute;right:10px;bottom:8px;cursor:pointer;user-select:none;font-size:16px}
.sets>.card{border-left:7px solid var(--ca,var(--ac));background:var(--cb,var(--panel))}
.sets>.card:nth-child(2){--ca:#0d9488;--cb:#ecfeff}.sets>.card:nth-child(3){--ca:#db2777;--cb:#fdf2f8}.sets>.card:nth-child(4){--ca:#7c3aed;--cb:#f5f3ff}.sets>.card:nth-child(5){--ca:#2563eb;--cb:#eff6ff}.sets>.card:nth-child(6){--ca:#ea580c;--cb:#fff7ed}.sets>.card:nth-child(7){--ca:#16a34a;--cb:#f0fdf4}.sets>.card:nth-child(8){--ca:#0284c7;--cb:#f0f9ff}.sets>.card:nth-child(9){--ca:#ca8a04;--cb:#fefce8}.sets>.card:nth-child(10){--ca:#64748b;--cb:#f8fafc}
[data-t=night] .sets>.card{background:var(--panel)!important}
.sets .card h2{color:var(--ca,var(--ac));font-size:20px;user-select:none}.sets .card h3{color:var(--ca,var(--ac))}
.sets label{font-size:14.5px;font-weight:600;color:var(--ink)}
.sets input:not([type=checkbox]):not([type=range]):not([type=file]):not([type=color]),.sets select,.sets textarea{font-size:17px;padding:10px 12px;border:2px solid var(--ca,var(--line));border-radius:10px;background:#fff;color:#111}
.sets input[type=color]{height:46px;padding:3px;border:2px solid var(--ca,var(--line));border-radius:10px;background:#fff;cursor:pointer}
.sets #fd,.sets #ur{font-size:19px;font-weight:600;padding:12px 14px}
.sets button.b:not(.r):not(.g){background:var(--ca,var(--ac))}.sets button.b.g{color:var(--ca,var(--ac));border-color:var(--ca,var(--ac))}
.sets .res{background:rgba(255,255,255,.75);border:1px dashed var(--ca,var(--line));color:#222}
.sets #log{background:rgba(255,255,255,.75);color:#222}
.who .wn,.sets .card h2 .who .wn{font-size:16px}
.caret{display:inline-block;width:1.3em;color:var(--ca,var(--ac))}.sets .card h2 .who{font-size:13px}
.clip{max-width:80px!important}
.tw td{overflow-wrap:anywhere}.dt th,.dt td{padding:6px 5px;font-size:13px;overflow-wrap:anywhere;word-break:break-word}.dt th{white-space:normal}
@media(max-width:760px){.dt,.dt tbody,.dt tr,.dt td{display:block;width:100%}.dt tr:first-child{display:none}.dt tr{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:6px 4px;background:var(--panel)}.dt td{display:flex;gap:8px;border:0;padding:3px 8px;font-size:14px}.dt td::before{content:attr(data-l);font-weight:600;color:var(--mut);min-width:92px;max-width:92px;flex:none}.clip{max-width:62vw!important}}
.hrow{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}.hs{flex:1 1 360px;min-width:260px}.hchart{flex:0 0 310px;max-width:100%}
.inv{width:100%;border-collapse:collapse;font-weight:600}.inv th{background:#00b0f0!important;color:#000!important;font-size:16px;text-align:left}.inv td,.inv th{border:1px solid #f0b400;padding:5px 10px}.inv tr:nth-child(even) td{background:#f3d1f2;color:#000}.inv tr:nth-child(odd) td{background:#f2f2f2;color:#000}
.npad{background:rgba(96,165,250,.18);border-radius:12px;padding:18px;display:flex;flex-wrap:wrap;gap:18px;align-content:flex-start;min-height:320px}
.ncard{position:relative;width:290px;min-height:96px;padding:12px 14px;cursor:pointer;color:#2a1f0e;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.4),transparent 40%),radial-gradient(circle at 80% 70%,rgba(160,110,40,.2),transparent 45%),#efd9a8;display:flex;flex-direction:column;gap:2px;box-shadow:0 0 10px 2px rgba(217,70,239,.35);transition:.15s;border-radius:3px}
.ncard:hover{transform:scale(1.04);box-shadow:0 0 16px 5px rgba(217,70,239,.6)}.ncard b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}.nbtn{position:absolute;right:8px;top:6px;display:flex;gap:10px;font-size:15px}.nbtn span{cursor:pointer}
#ned{min-height:260px;max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:#111;line-height:1.7;outline:none}
.tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}.ckb{cursor:pointer;font-size:1.1em;margin-right:4px;user-select:none}.ckb[data-c="1"]{color:#16a34a;font-weight:700}.nl{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.lb{font-weight:700;margin-right:6px}.lb.hl{background:#fde047;padding:0 6px;border-radius:3px}
.tb .cb{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #888;cursor:pointer}.sb{cursor:pointer;margin-left:4px;font-size:11px;opacity:.85}details>summary{margin-bottom:6px}input[readonly]{background:var(--bg)}summary{cursor:pointer;font-weight:600}
@media(max-width:760px){aside{position:fixed;z-index:9;height:100%;left:calc(var(--sw)*-1)}body.mopen aside{left:0}body.hide aside{margin-left:0}.rs{display:none}#ttl,#meas{font-size:20px}header{flex-wrap:wrap}}
</style></head>
<body data-t="sea">
<aside id="side"><h1>🩺 মেনু</h1><div id="nav"></div><div class="rs" id="rs" title="চওড়া করতে টানুন"></div></aside>
<main>
<header>
<button class="b g" onclick="tog()" title="সাইডবার দেখান/লুকান">☰</button>
<span id="hav" class="av"></span><button class="b g" onclick="lockNow()" title="লক করুন / অন্য প্রোফাইলে যান">🔒</button><select id="who" style="display:none"></select>
<input id="ttl" oninput="S.set.title=this.value;sz();save()" placeholder="শিরোনাম লিখুন"><span id="meas"></span>
<span class="sync wait" id="sync">সিঙ্ক: শুরু হয়নি</span>
</header>
<div id="view"><div class="card"><b>ড্যাশবোর্ড লোড হচ্ছে…</b><br>এই লেখা না সরলে বুঝবেন আপনার ব্রাউজার বা ফাইল ভিউয়ার স্ক্রিপ্ট চালাচ্ছে না। ফাইলটি Chrome ব্রাউজারে খুলুন (ফাইল ম্যানেজার/প্রিভিউ থেকে নয়)।</div></div>
</main>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF=()=>({members:[{id:'m1',name:'আমি',photo:''}],records:[],body:[],diet:[],lipid:[],sugar:[],actv:[],dsug:[],opts:{},tomb:[],mdel:[],note:[],doc:[],rng:[],prot:[],food:[],org:[],gi:[],marks:{},notes:{},log:[],set:{theme:'sea',folder:'Family_Health_DB',url:'',title:'স্বাস্থ্য ডায়েরি',df:'dd mmm yyyy',nicon:16,nw:290,names:{},sw:230,hide:false,k:{bmin:18.5,bmax:24.9,wm:90,wf:80}}});
let S,cur,page='home',fp=[],edId=null,lipU='mg/dL',lipEd=null,_t;
/* storage: IndexedDB (ছবির জন্য বেশি জায়গা) */
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('fh',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>r(q.result);q.onerror=j});
function idbGet(){return new Promise(function(res){var done=false;function fin(v){if(!done){done=true;res(v)}}setTimeout(function(){fin(null)},1500);try{idb().then(function(d){var q=d.transaction('s').objectStore('s').get('S');q.onsuccess=function(){fin(q.result)};q.onerror=function(){fin(null)}}).catch(function(){fin(null)})}catch(e){fin(null)}})}
function idbSet(v){try{idb().then(function(d){d.transaction('s','readwrite').objectStore('s').put(v,'S')}).catch(function(){log('সংরক্ষণ ব্যর্থ')})}catch(e){}}
function save(){S.cur=cur;clearTimeout(_t);_t=setTimeout(()=>idbSet(S),200)}
function fix(d){const D=DEF();d=Object.assign(D,d);d.set=Object.assign(D.set,d.set);d.set.k=Object.assign(DEF().set.k,d.set.k);
d.records.forEach(r=>{if(r.res!==undefined&&!r.vals){r.vals={'রেজাল্ট':r.res};delete r.res}if(r.photo){r.photos=[r.photo];delete r.photo}if(r.med===undefined)r.med=''});
if(!d.set.rngSeeded){d.rng=RG.map((r,i)=>({id:'r'+i,date:'',test:r[0],normal:r[1],low:r[2],high:r[3],note:(d.notes||{})[i]||''}));d.set.rngSeeded=1}
if(!d.set.giSeeded){d.gi=GI0.map((x,i)=>({id:'d'+i,date:'',bn:x[0],en:x[1],gi:x[2],dm:x[3],nd:x[4]})).concat(d.gi||[]);d.set.giSeeded=1}
if(!d.set.foodSeeded){d.food=FD.map((x,i)=>({id:'f'+i,date:'',src:x[0],w:100,wu:'গ্রাম',kcal:x[2],prot:x[3],carb:x[4],fib:x[5],gfat:+(x[6]-x[7]).toFixed(1),bfat:x[7],om3:x[8]}));d.set.foodSeeded=1}
(d.members||[]).forEach(function(m){if(m.pin===undefined)m.pin='';if(m.rc===undefined)m.rc=''});PMK.forEach(function(k){(d[k]||[]).forEach(function(r){if(!r.m&&d.members[0])r.m=d.members[0].id})});
return d}
function log(m){window._lm=m;const sm=$('#smsg');if(sm)sm.textContent=m;S.log.push(new Date().toLocaleString('bn-BD')+' — '+m);S.log=S.log.slice(-100);const l=$('#log');if(l)l.innerHTML=logHtml()}
function logHtml(){return S.log.map((l,i)=>`<div>${esc(l)} <a href="#" onclick="logDel(${i});return false" style="color:var(--bad)">✕</a></div>`).reverse().join('')||'এখনো কিছু হয়নি'}
function logDel(i){S.log.splice(i,1);save();$('#log').innerHTML=logHtml()}
function logClear(){if(confirm('সব লগ মুছবেন?')){S.log=[];window._lm='লগ মুছে ফেলা হয়েছে';save();$('#log').innerHTML=logHtml()}}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DFS=[['dd mmm yyyy','17 Oct 2026'],['dd MMMM yyyy','17 October 2026'],['dd-mm-yyyy','17-10-2026'],['dd/mm/yyyy','17/10/2026'],['mm/dd/yyyy','10/17/2026'],['yyyy-mm-dd','2026-10-17']];
function fd(v){if(!v||!/^\d{4}-\d{2}-\d{2}$/.test(v))return v==null?'':v;const y=v.slice(0,4),m=v.slice(5,7),d=v.slice(8,10),f=S.set.df||'dd mmm yyyy',i=+m-1;return f=='dd mmm yyyy'?d+' '+MON[i]+' '+y:f=='dd MMMM yyyy'?d+' '+MONF[i]+' '+y:f=='dd-mm-yyyy'?d+'-'+m+'-'+y:f=='dd/mm/yyyy'?d+'/'+m+'/'+y:f=='mm/dd/yyyy'?m+'/'+d+'/'+y:v}
const now=()=>fd(today())+', '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
function age(d){if(!d)return'';const b=new Date(d),n=new Date();if(isNaN(b))return'';let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth();if(n.getDate()<b.getDate())m--;if(m<0){y--;m+=12}return y+' বছর '+m+' মাস'}
function who(){const m=me();return`<span class="who"><span class="wn">👤 <b>${esc(m.name)}</b></span>${m.dob?`<span>🎂 ${esc(fd(m.dob))}</span><span>বয়স: <b>${age(m.dob)}</b></span>`:''}</span>`}
function bar(){const m=me();return`<div class="card" style="padding:10px 16px">👤 <b>${esc(m.name)}</b>${m.dob?` · জন্ম: ${esc(m.dob)} · বয়স: <b>${age(m.dob)}</b>`:' · <span class="mut">জন্মতারিখ সেটিং-এ দিলে বয়স দেখাবে</span>'}</div>`}
function flush(){clearTimeout(_t);if(S){S.cur=cur;idbSet(S)}}
window.addEventListener('pagehide',flush);document.addEventListener('visibilitychange',function(){if(document.visibilityState=='hidden')flush()});
function appCfg(){return Object.assign({name:'স্বাস্থ্য ডায়েরি',short:'স্বাস্থ্য',emoji:'🩺',bg:'#0f766e',img:''},S.set.app||{})}

function modal(h,w){mclose();const m=document.createElement('div');m.id='md';m.className='ov';m.innerHTML=`<div class="mp ${w?'w':''}"><button class="x" onclick="mclose()">✕</button>${h}</div>`;m.onclick=e=>{if(e.target==m)mclose()};document.body.appendChild(m);const pn=m.firstChild,hd=pn.querySelector('h2');if(hd){hd.style.cursor='move';hd.style.touchAction='none';hd.title='টেনে সরানো যায়';let x=0,y=0,sx=0,sy=0;hd.onpointerdown=e=>{sx=e.clientX-x;sy=e.clientY-y;hd.setPointerCapture(e.pointerId);hd.onpointermove=v=>{x=v.clientX-sx;y=v.clientY-sy;pn.style.transform='translate('+x+'px,'+y+'px)'};hd.onpointerup=()=>{hd.onpointermove=null}}}}

function readPhoto(file,cb,max=1400){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};i.src=r.result};r.readAsDataURL(file)}

<div class="card tw"><details><summary>📖 রেফারেন্স (ক্লিক করে দেখুন / লুকান)</summary><h3>সুগার (mmol/L)</h3><table><tr><th>পরীক্ষা</th><th>স্বাভাবিক</th><th>প্রি-ডায়াবেটিস</th><th>ডায়াবেটিস</th></tr><tr><td>খালি পেটে</td><td>৩.৯–৫.৫ (৭০–৯৯ mg/dL)</td><td>৫.৬–৬.৯</td><td>৭.০ বা বেশি</td></tr><tr><td>২ ঘণ্টা পর / OGTT</td><td>৭.৮ এর কম</td><td>৭.৮–১১.০</td><td>১১.১ বা বেশি</td></tr><tr><td>যেকোনো সময়</td><td>—</td><td>—</td><td>১১.১ বা বেশি (লক্ষণসহ)</td></tr><tr><td>HbA1c</td><td>৫.৭% এর কম</td><td>৫.৭–৬.৪%</td><td>৬.৫% বা বেশি</td></tr></table>
<h3>HOMA-IR</h3>১.০ এর কম = কাম্য · ১.০–১.৯ = স্বাভাবিকের কাছাকাছি · ১.৯–২.৯ = প্রাথমিক ইনসুলিন রেজিস্ট্যান্স · ২.৯ এর বেশি = উল্লেখযোগ্য রেজিস্ট্যান্স (ল্যাবভেদে সীমা আলাদা হতে পারে)
<p>৩.৯ mmol/L (৭০ mg/dL) এর নিচে = হাইপোগ্লাইসেমিয়া: কাঁপুনি, ঘাম, মাথা ঘোরা — সঙ্গে সঙ্গে চিনি/গ্লুকোজ খান ও ডাক্তার দেখান। অনেক বেশি হলে: অতিরিক্ত পিপাসা, বারবার প্রস্রাব, দুর্বলতা। ১ mmol/L = ১৮ mg/dL</p></details></div>`)}
function homaCalc(){const g0=parseFloat($('#h_g').value),i=parseFloat($('#h_i').value);if(!g0||!i)return;const g=$('#h_u').value=='mg/dL'?g0/18:g0,h=g*i/22.5,b=g>3.5?20*i/(g-3.5):null,q=1/(Math.log10(i)+Math.log10(g*18));
const t=h<1?['ok','কাম্য']:h<1.9?['ok','স্বাভাবিকের কাছাকাছি']:h<2.9?['warn','প্রাথমিক ইনসুলিন রেজিস্ট্যান্সের ইঙ্গিত']:['bad','উল্লেখযোগ্য ইনসুলিন রেজিস্ট্যান্সের ইঙ্গিত'];
$('#h_r').innerHTML=`HOMA-IR = <b>${h.toFixed(2)}</b> <span class="tag t-${t[0]}">${t[1]}</span><br>HOMA-β = <b>${b?b.toFixed(0)+'%':'—'}</b> · QUICKI = <b>${q.toFixed(3)}</b><br><small>এটি নির্ণয় নয় — ডাক্তারের পরামর্শ নিন।</small>`}
function calcSugar(){let v=parseFloat($('#gv').value);if(!v)return;if($('#gu').value=='mg/dL')v/=18;const t=$('#gt').value;let r;
if(v<3.9)r=['bad','কম (হাইপো) — দ্রুত গ্লুকোজ নিন'];else if(t=='f')r=v<5.6?['ok','স্বাভাবিক']:v<7?['warn','প্রি-ডায়াবেটিস সীমা']:['bad','ডায়াবেটিস সীমা'];else if(t=='p')r=v<7.8?['ok','স্বাভাবিক']:v<11.1?['warn','প্রি-ডায়াবেটিস সীমা']:['bad','ডায়াবেটিস সীমা'];else r=v<11.1?['ok','ডায়াবেটিস সীমার নিচে']:['bad','ডায়াবেটিস সীমা'];
$('#gr').innerHTML=`${v.toFixed(1)} mmol/L = ${(v*18).toFixed(0)} mg/dL <span class="tag t-${r[0]}">${r[1]}</span><br><small>এটি নির্ণয় নয় — ডাক্তারের পরামর্শ নিন।</small>`}

/* BMI, শরীর (এক্সেল ফাইলের সূত্র অনুযায়ী) */
function bmiRows(sx,h,w,wa){const K=S.set.k,o=[],lim=sx=='নারী'?K.wf:K.wm;
if(h){const m=h/100;o.push(['এই উচ্চতায় সুস্থ ওজন',`<b>${(K.bmin*m*m).toFixed(1)} – ${(K.bmax*m*m).toFixed(1)} কেজি</b>`]);o.push(['কোমরের সীমা',`<b>${Math.min(lim,h/2).toFixed(0)} সেমি বা কম</b> (${sx} সীমা ${lim}, উচ্চতার অর্ধেক ${(h/2).toFixed(1)})`])}
else if(w){o.push(['এই ওজনের জন্য উপযুক্ত উচ্চতা',`<b>${(Math.sqrt(w/K.bmax)*100).toFixed(0)} – ${(Math.sqrt(w/K.bmin)*100).toFixed(0)} সেমি</b>`]);o.push(['কোমরের সীমা ('+sx+')',`<b>${lim} সেমি বা কম</b>`])}
else if(wa){o.push(['কোমর অনুযায়ী ন্যূনতম উচ্চতা',`<b>${(wa*2).toFixed(0)} সেমি</b> (কোমর ≤ উচ্চতার অর্ধেক)`])}
if(h&&w){const b=w/((h/100)**2),r=b<K.bmin?['warn','কম ওজন']:b<=K.bmax?['ok','স্বাভাবিক']:b<30?['warn','অতিরিক্ত ওজন']:['bad','স্থূলতা'];o.push(['BMI',`<b>${b.toFixed(1)}</b> <span class="tag t-${r[0]}">${r[1]}</span>`]);
const d=w<K.bmin*(h/100)**2?(K.bmin*(h/100)**2-w):w>K.bmax*(h/100)**2?(K.bmax*(h/100)**2-w):0;if(d)o.push(['সুস্থ সীমায় আসতে',`<b>${d>0?'+':''}${d.toFixed(1)} কেজি</b>`])}
if(wa){const ok=wa<=lim,half=h?wa<=h/2:null;o.push(['কোমরের অবস্থা',`<span class="tag t-${ok?'ok':'bad'}">${ok?'ভালো':'ঝুঁকি'}</span>`+(half==null?'':` উচ্চতার অর্ধেকের ${half?'মধ্যে — হ্যাঁ':'বেশি — না'}`)])}
return o.map(r=>`<div>${r[0]}: ${r[1]}</div>`).join('')||'উচ্চতা, ওজন বা কোমর — যেকোনো একটি দিন'}
const nv=id=>{const v=parseFloat($('#'+id).value);return isNaN(v)?0:v};

<h3>কোমর মাপার পদ্ধতি</h3>১) সোজা হয়ে দাঁড়ান, পেট শিথিল রাখুন। ২) শেষ পাঁজর ও হিপ বোনের উপরের অংশের ঠিক মাঝখানে, নাভির সামান্য উপরে ফিতা ঘুরান। ৩) ফিতা মাটির সমান্তরাল রাখুন, চামড়ায় চেপে বসাবেন না। ৪) স্বাভাবিক শ্বাস ছাড়ার পর মাপুন।<br><small>BMI আনুমানিক হিসাব; পেশিবহুল মানুষের BMI বেশি দেখালেও তিনি সুস্থ হতে পারেন।</small></div>`;hwT()}

function migrate(from,to){PMK.forEach(k=>S[k].forEach(r=>{if(r.m==from)r.m=to}));S.tomb.forEach(t=>{if(t.m==from)t.m=to})}
function dirList(){return S.members.filter(m=>m.pin).map(m=>({id:m.id,name:m.name,pin:m.pin,rc:m.rc,dts:m.dts||0})).concat(S.mdel||[])}
function dirApply(list){let ch=0;const live=list.filter(r=>!r.del),gone=list.filter(r=>r.del),sameN=(a,b)=>String(a).trim().toLowerCase()==String(b).trim().toLowerCase();
live.forEach(r=>{const m=S.members.find(x=>x.id==r.id);
if(!m){const d=S.members.find(x=>x.id!=r.id&&sameN(x.name,r.name)&&!live.some(l=>l.id==x.id)),n={id:r.id,name:r.name,photo:'',dob:'',pin:r.pin,rc:r.rc,dts:r.dts,alt:[]};
if(d){migrate(d.id,r.id);if(d.pin)n.alt.push({id:d.id,pin:d.pin,rc:d.rc});['photo','dob','target','inv','ts','ns','nd','dirty'].forEach(k=>{if(d[k]!=null)n[k]=d[k]});S.members=S.members.filter(x=>x!==d);if(cur==d.id)cur=r.id}
S.members.push(n);ch=1}
else if((r.dts||0)>(m.dts||0)){m.name=r.name;m.pin=r.pin;m.rc=r.rc;m.dts=r.dts;m.alt=[];ch=1}});
let lost=false;gone.forEach(r=>{const m=S.members.find(x=>x.id==r.id);if(!m)return;
if(r.into){const t=S.members.find(x=>x.id==r.into);if(!t)return;migrate(m.id,t.id);if(r.pin||m.pin)(t.alt=t.alt||[]).push({id:m.id,pin:r.pin||m.pin,rc:r.rc||m.rc});if(cur==m.id)cur=t.id}
else{if((r.dts||0)<(m.dts||0))return;PMK.forEach(k=>S[k]=S[k].filter(x=>x.m!=m.id));if(cur==m.id)lost=true}
S.members=S.members.filter(x=>x!==m);ch=1});
if(live.length&&ch)S.members=S.members.filter(m=>!(m.pin===''&&m.name=='আমি'&&!PMK.some(k=>S[k].some(r=>r.m==m.id))&&m.id!=cur));
if(lost){cur=null;if($('#view'))setTimeout(lockNow,0)}return ch}
