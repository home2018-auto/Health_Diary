<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>স্বাস্থ্য ডায়েরি</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f766e"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--sw:230px;--bg:#eef5f3;--panel:#fff;--ink:#16302b;--mut:#5d7771;--ac:#0f766e;--line:#d3e3df;--side:#0b4f4a;--sideink:#d9f2ee;--bad:#c2410c;--ok:#15803d;--warn:#b45309}
[data-t=rose]{--bg:#fbf0f2;--ink:#3a1a22;--mut:#85616b;--ac:#be185d;--line:#efd5db;--side:#6b1236;--sideink:#fde4ec}
[data-t=night]{--bg:#12162b;--panel:#1b2140;--ink:#e6e9ff;--mut:#9aa3d6;--ac:#818cf8;--line:#2c3563;--side:#0a0d1d;--sideink:#c7cdfb}
[data-t=sand]{--bg:#f6f0e3;--ink:#33291a;--mut:#80725a;--ac:#a16207;--line:#e6dbc2;--side:#5a4416;--sideink:#faefd0}
[data-t=forest]{--bg:#edf3e8;--ink:#1d2d1a;--mut:#62785c;--ac:#3f6212;--line:#d4e2c9;--side:#27400d;--sideink:#e1f1cf}
[data-t=slate]{--bg:#eceff3;--ink:#1e293b;--mut:#64748b;--ac:#334155;--line:#d5dce6;--side:#1e293b;--sideink:#dbe3ef}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'Hind Siliguri','Noto Sans Bengali','Segoe UI',sans-serif;background:var(--bg);color:var(--ink);display:flex;font-size:15px;overflow:hidden}
aside{width:var(--sw);background:var(--side);color:var(--sideink);padding:14px 10px;overflow:auto;flex:none;position:relative;transition:margin .2s}
body.hide aside{margin-left:calc(var(--sw)*-1)}
aside h1{font-size:17px;margin:4px 8px 12px}
aside button.n{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 12px;border-radius:8px;font:inherit;cursor:pointer}
aside button.n:hover{background:#ffffff1a}aside button.n.on{background:#ffffff30;font-weight:600}
.rs{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;touch-action:none}.rs:hover{background:#ffffff40}
main{flex:1;min-width:0;overflow:auto;padding:0 18px 40px}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
#ttl,#meas{font-family:inherit;font-size:27px;font-weight:700}
#ttl{border:0;background:transparent;color:var(--ac);text-align:center;margin:0 auto;min-width:60px;max-width:100%;padding:0 6px}
#meas{position:absolute;visibility:hidden;white-space:pre}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--ac);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
select,input,textarea,button.b{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
textarea{width:100%;min-height:80px}
button.b{background:var(--ac);color:#fff;border:0;cursor:pointer;padding:8px 14px}button.b.g{background:var(--panel);color:var(--ac);border:1px solid var(--ac)}button.b.r{background:var(--bad)}button.b.s{padding:4px 9px}
.sync{font-size:13px;padding:5px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.sync.ok{color:var(--ok)}.sync.wait{color:var(--warn)}.sync.err{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:18px}.card h3{margin:14px 0 6px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mut)}label input,label select{display:block;width:100%;margin-top:3px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600;white-space:nowrap}
.clip{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;color:var(--ac)}.mut{color:var(--mut)}
.thumb{width:46px;height:46px;object-fit:cover;border-radius:6px;cursor:pointer}.ph{position:relative;display:inline-block;cursor:pointer}
.bd{position:absolute;right:-5px;top:-5px;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px}
.res{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--bg);line-height:1.8}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;color:#fff}
.t-ok{background:var(--ok)}.t-warn{background:var(--warn)}.t-bad{background:var(--bad)}
#log{max-height:200px;overflow:auto;font-size:13px;background:var(--bg);padding:10px;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.th{display:flex;gap:8px;flex-wrap:wrap}.th button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
.mp{background:var(--panel);color:var(--ink);border-radius:14px;padding:18px;width:min(620px,100%);max-height:92vh;overflow:auto;position:relative}
.mp.w{width:min(96vw,1100px)}.mp h2{margin:0 30px 12px 0;font-size:18px}
.x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:20px;color:var(--mut);cursor:pointer}
.gimg{display:block;margin:auto;max-width:100%;max-height:72vh;object-fit:contain}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
table th{background:var(--ac);color:var(--panel)}.tw table tr:nth-child(odd):not(:first-child){background:rgba(127,127,127,.13)}.who{font-size:14px;font-weight:500;margin-left:30px;display:inline-flex;gap:28px;flex-wrap:wrap;color:var(--ac);vertical-align:middle}.clip{max-width:80px!important}.sb{cursor:pointer;margin-left:4px;font-size:11px;opacity:.85}details>summary{margin-bottom:6px}input[readonly]{background:var(--bg)}summary{cursor:pointer;font-weight:600}
@media(max-width:760px){aside{position:fixed;z-index:9;height:100%;left:calc(var(--sw)*-1)}body.mopen aside{left:0}body.hide aside{margin-left:0}.rs{display:none}#ttl,#meas{font-size:20px}header{flex-wrap:wrap}}
</style></head>
<body data-t="sea">
<aside id="side"><h1>🩺 মেনু</h1><div id="nav"></div><div class="rs" id="rs" title="চওড়া করতে টানুন"></div></aside>
<main>
<header>
<button class="b g" onclick="tog()" title="সাইডবার দেখান/লুকান">☰</button>
<span id="hav" class="av"></span><button class="b g" onclick="lockNow()" title="লক করুন / অন্য প্রোফাইলে যান">🔒</button><select id="who" style="display:none"></select>
<input id="ttl" oninput="S.set.title=this.value;sz();save()" placeholder="শিরোনাম লিখুন"><span id="meas"></span>
<span class="sync wait" id="sync">সিঙ্ক: শুরু হয়নি</span>
</header>
<div id="view"><div class="card"><b>ড্যাশবোর্ড লোড হচ্ছে…</b><br>এই লেখা না সরলে বুঝবেন আপনার ব্রাউজার বা ফাইল ভিউয়ার স্ক্রিপ্ট চালাচ্ছে না। ফাইলটি Chrome ব্রাউজারে খুলুন (ফাইল ম্যানেজার/প্রিভিউ থেকে নয়)।</div></div>
</main>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF=()=>({members:[{id:'m1',name:'আমি',photo:''}],records:[],body:[],diet:[],lipid:[],sugar:[],actv:[],dsug:[],opts:{},doc:[],rng:[],prot:[],food:[],org:[],gi:[],marks:{},notes:{},log:[],set:{theme:'sea',folder:'Family_Health_DB',url:'',title:'স্বাস্থ্য ডায়েরি',names:{},sw:230,hide:false,k:{bmin:18.5,bmax:24.9,wm:90,wf:80}}});
let S,cur,page='home',fp=[],edId=null,lipU='mg/dL',lipEd=null,_t;
/* storage: IndexedDB (ছবির জন্য বেশি জায়গা) */
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('fh',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>r(q.result);q.onerror=j});
function idbGet(){return new Promise(function(res){var done=false;function fin(v){if(!done){done=true;res(v)}}setTimeout(function(){fin(null)},1500);try{idb().then(function(d){var q=d.transaction('s').objectStore('s').get('S');q.onsuccess=function(){fin(q.result)};q.onerror=function(){fin(null)}}).catch(function(){fin(null)})}catch(e){fin(null)}})}
function idbSet(v){try{idb().then(function(d){d.transaction('s','readwrite').objectStore('s').put(v,'S')}).catch(function(){log('সংরক্ষণ ব্যর্থ')})}catch(e){}}
function save(){S.cur=cur;clearTimeout(_t);_t=setTimeout(()=>idbSet(S),200)}
function fix(d){const D=DEF();d=Object.assign(D,d);d.set=Object.assign(D.set,d.set);d.set.k=Object.assign(DEF().set.k,d.set.k);
d.records.forEach(r=>{if(r.res!==undefined&&!r.vals){r.vals={'রেজাল্ট':r.res};delete r.res}if(r.photo){r.photos=[r.photo];delete r.photo}if(r.med===undefined)r.med=''});
if(!d.set.rngSeeded){d.rng=RG.map((r,i)=>({id:'r'+i,date:'',test:r[0],normal:r[1],low:r[2],high:r[3],note:(d.notes||{})[i]||''}));d.set.rngSeeded=1}
if(!d.set.giSeeded){d.gi=GI0.map((x,i)=>({id:'d'+i,date:'',bn:x[0],en:x[1],gi:x[2],dm:x[3],nd:x[4]})).concat(d.gi||[]);d.set.giSeeded=1}
if(!d.set.foodSeeded){d.food=FD.map((x,i)=>({id:'f'+i,date:'',src:x[0],w:100,wu:'গ্রাম',kcal:x[2],prot:x[3],carb:x[4],fib:x[5],gfat:+(x[6]-x[7]).toFixed(1),bfat:x[7],om3:x[8]}));d.set.foodSeeded=1}
(d.members||[]).forEach(function(m){if(m.pin===undefined)m.pin='';if(m.rc===undefined)m.rc=''});PMK.forEach(function(k){(d[k]||[]).forEach(function(r){if(!r.m&&d.members[0])r.m=d.members[0].id})});
return d}
function log(m){window._lm=m;const sm=$('#smsg');if(sm)sm.textContent=m;S.log.push(new Date().toLocaleString('bn-BD')+' — '+m);S.log=S.log.slice(-100);const l=$('#log');if(l)l.innerHTML=logHtml()}
function logHtml(){return S.log.map((l,i)=>`<div>${esc(l)} <a href="#" onclick="logDel(${i});return false" style="color:var(--bad)">✕</a></div>`).reverse().join('')||'এখনো কিছু হয়নি'}
function logDel(i){S.log.splice(i,1);save();$('#log').innerHTML=logHtml()}
function logClear(){if(confirm('সব লগ মুছবেন?')){S.log=[];window._lm='লগ মুছে ফেলা হয়েছে';save();$('#log').innerHTML=logHtml()}}
const now=()=>new Date().toLocaleString('bn-BD');
function age(d){if(!d)return'';const b=new Date(d),n=new Date();if(isNaN(b))return'';let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth();if(n.getDate()<b.getDate())m--;if(m<0){y--;m+=12}return y+' বছর '+m+' মাস'}
function who(){const m=me();return`<span class="who"><span>👤 <b>${esc(m.name)}</b></span>${m.dob?`<span>🎂 ${esc(m.dob)}</span><span>বয়স: <b>${age(m.dob)}</b></span>`:''}</span>`}
function bar(){const m=me();return`<div class="card" style="padding:10px 16px">👤 <b>${esc(m.name)}</b>${m.dob?` · জন্ম: ${esc(m.dob)} · বয়স: <b>${age(m.dob)}</b>`:' · <span class="mut">জন্মতারিখ সেটিং-এ দিলে বয়স দেখাবে</span>'}</div>`}
function flush(){clearTimeout(_t);if(S){S.cur=cur;idbSet(S)}}
window.addEventListener('pagehide',flush);document.addEventListener('visibilitychange',function(){if(document.visibilityState=='hidden')flush()});
function setSync(t,c){const e=$('#sync');e.textContent='সিঙ্ক: '+t;e.className='sync '+c}

/* নাম, সাইডবার */
const NAV=[['home','🔍 সার্চ ও সারসংক্ষেপ'],['records','🧪 চেকআপ রেকর্ড'],['lipid','🫀 লিপিড প্রোফাইল ক্যালকুলেটর'],['sugar','🩸 সুগার গাইড'],['body','⚖️ শরীরের তথ্য'],['conv','🧮 BMI ও ওজন-উচ্চতা'],['ranges','📋 স্বাভাবিক মান ও সমস্যা'],['diet','🍽️ রুটিন ও ডায়েট চার্ট'],['actv','🏃 ডেইলি অ্যাক্টিভিটি'],['dsug','📈 ডেইলি সুগার টেস্ট রেজাল্ট'],['prot','💪 প্রোটিন ক্যালকুলেশন'],['food','🥦 খাদ্য উপাদান'],['org','🛒 অর্গানিক খাবার ক্রয়'],['gi','🍚 খাবারের গ্লাইসেমিক ইনডেক্স'],['set','⚙️ সেটিং ও ব্যাকআপ']];
const NK={rng:'ranges'},EXTRA={doc:'🩺 ডক্টর ভিজিট'};const L=k=>{k=NK[k]||k;const n=NAV.find(x=>x[0]==k);return S.set.names[k]||(n?n[1]:(EXTRA[k]||k))};
function nav(){$('#nav').innerHTML=NAV.map(n=>`<button class="n ${page==n[0]?'on':''}" onclick="go('${n[0]}')">${esc(L(n[0]))}</button>`).join('')}
function go(p){page=p;document.body.classList.remove('mopen');render();$('main').scrollTop=0}
function tog(){if(innerWidth<=760)document.body.classList.toggle('mopen');else{S.set.hide=!S.set.hide;applyL();save()}}
function applyL(){document.documentElement.style.setProperty('--sw',S.set.sw+'px');document.body.classList.toggle('hide',!!S.set.hide)}
$('#rs').onpointerdown=e=>{const r=$('#rs');r.setPointerCapture(e.pointerId);r.onpointermove=v=>{S.set.sw=Math.max(150,Math.min(420,v.clientX));applyL()};r.onpointerup=()=>{r.onpointermove=null;save()}};
function sz(){const t=$('#ttl'),m=$('#meas');m.textContent=t.value||t.placeholder;t.style.width=(m.offsetWidth+26)+'px'}
const me=()=>S.members.find(m=>m.id==cur)||S.members[0];
function head(){const m=me();
$('#hav').innerHTML=m.photo?`<img class="av" src="${m.photo}">`:esc(m.name[0]||'?');$('#ttl').value=S.set.title;sz()}
function render(){document.body.dataset.t=S.set.theme;nav();head();({home,records:()=>tbl('records'),lipid:()=>tbl('lipid'),sugar,body:()=>tbl('body'),conv,ranges:()=>tbl('rng'),diet:()=>tbl('diet'),actv:()=>tbl('actv'),dsug:()=>tbl('dsug'),gi:()=>tbl('gi'),prot:protPage,food:()=>tbl('food'),org:()=>tbl('org'),set:settings})[page]();if(page=='set')netChk();const h2=$('#view h2');if(h2)h2.insertAdjacentHTML('beforeend',who());save()}

/* পপআপ */
function modal(h,w){mclose();const m=document.createElement('div');m.id='md';m.className='ov';m.innerHTML=`<div class="mp ${w?'w':''}"><button class="x" onclick="mclose()">✕</button>${h}</div>`;m.onclick=e=>{if(e.target==m)mclose()};document.body.appendChild(m);const pn=m.firstChild,hd=pn.querySelector('h2');if(hd){hd.style.cursor='move';hd.style.touchAction='none';hd.title='টেনে সরানো যায়';let x=0,y=0,sx=0,sy=0;hd.onpointerdown=e=>{sx=e.clientX-x;sy=e.clientY-y;hd.setPointerCapture(e.pointerId);hd.onpointermove=v=>{x=v.clientX-sx;y=v.clientY-sy;pn.style.transform='translate('+x+'px,'+y+'px)'};hd.onpointerup=()=>{hd.onpointermove=null}}}}
function mclose(){const m=$('#md');if(m)m.remove()}
function readPhoto(file,cb,max=1400){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};i.src=r.result};r.readAsDataURL(file)}

/* ফর্ম বিবরণ */
const TESTS=['ব্লাড সুগার','লিপিড প্রোফাইল','প্রেসার','ইউরিন টেস্ট','ইউরিক অ্যাসিড','HbA1c','কিডনি (ক্রিয়েটিনিন)','লিভার (SGPT)','অন্যান্য'];
const TF={'লিপিড প্রোফাইল':['টোটাল কোলেস্টেরল (TC)','ট্রাইগ্লিসারাইড (TG)','HDL','LDL','VLDL','TC/HDL','TG/HDL'],'প্রেসার':['সিস্টোলিক (উপরের)','ডায়াস্টোলিক (নিচের)','পালস'],'ব্লাড সুগার':['খালি পেটে','২ ঘণ্টা পর','র‍্যান্ডম'],'ইউরিন টেস্ট':['সুগার','অ্যালবুমিন','পাস সেল','অন্যান্য']};
const F={
records:[['date','তারিখ','date'],['med','মেডিকেল/ল্যাবের নাম','text'],['test','টেস্টের ধরন','select',TESTS],['vals','','vals'],['note','নোট','area'],['photos','রিপোর্টের ছবি (একাধিক)','photos']],
body:[['date','তারিখ','date'],['sex','লিঙ্গ','select',['পুরুষ','নারী']],['ht','উচ্চতা (সেমি)','number'],['wt','ওজন (কেজি)','number'],['waist','কোমরের মাপ (সেমি)','number'],['dis','রোগের নাম','text'],['note','নোট','area']],
diet:[['date','তারিখ','date'],['time','সময়','time'],['kind','ধরন','select',['খাবার','ওষুধ','হাঁটা/ব্যায়াম','পানি','ঘুম','অন্যান্য']],['what','কী খাচ্ছি / করছি','text'],['dir','নির্দেশনা','area']],

function addM(){const n=$('#nm').value.trim(),p=$('#nn').value;if(!n)return log('❌ সদস্যের নাম লিখুন');if(!isPin(p))return log('❌ PIN ঠিক ৪ অক্ষরের হতে হবে');const m={id:uid(),name:n,photo:'',dob:'',pin:'',rc:''},c=setPin(m,p);S.members.push(m);save();log('✅ নতুন সদস্য যোগ হয়েছে: '+n);if(S.set.url)memberSync(m);$('#nm').value='';$('#nn').value='';modal(`<h2>✅ ${esc(n)} যোগ হয়েছে</h2><p>রিকভারি কোড (${esc(n)}-কে লিখে রাখতে বলুন):</p><div class="res" style="font-size:26px;text-align:center;letter-spacing:3px"><b>${c}</b></div><p>${esc(n)} লক স্ক্রিন থেকে নিজের PIN দিয়ে ঢুকবে; অন্য কারও ডাটা দেখা যাবে না।</p>`)}
function delM(){askPin('এই প্রোফাইল ও এর সব ডাটা মুছতে PIN দিন',()=>{if(!confirm(me().name+' ও তার সব রেকর্ড মুছবেন? (Google Drive-এর ফাইল মুছবে না)'))return;const id=cur;S.members=S.members.filter(x=>x.id!=id);PMK.forEach(k=>S[k]=S[k].filter(r=>r.m!=id));save();lockNow()})}
/* ব্যাকআপ (শুধু নিজের প্রোফাইল) */
function bk(){const m=me(),rows={};PMK.forEach(k=>rows[k]=S[k].filter(r=>r.m==m.id));const o={fmt:2,date:now(),member:m,rows:rows,shared:{gi:S.gi,rng:S.rng,food:S.food,opts:S.opts}},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='backup_'+m.name+'_'+today()+'.json';a.click();log('✅ ব্যাকআপ ফাইল ডাউনলোড হয়েছে ('+m.name+' — শুধু এই প্রোফাইলের ডাটা)')}
function rs(){const f=$('#bkf')&&$('#bkf').files[0];if(!f){log('❌ রিস্টোর হয়নি: আগে "Choose file" দিয়ে ব্যাকআপ ফাইল বাছুন');return alert('আগে ব্যাকআপ ফাইল বাছুন')}if(!confirm('এই ব্যাকআপ থেকে ডাটা ফিরিয়ে আনবেন?'))return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
if(d.fmt==2){const m=d.member;if(!m||!m.id)throw 0;const ex=S.members.find(x=>x.id==m.id);if(ex&&ex.id!=cur){log('❌ রিস্টোর হয়নি: ব্যাকআপটি অন্য প্রোফাইলের — সেই প্রোফাইলে ঢুকে রিস্টোর করুন');return alert('ব্যাকআপটি অন্য প্রোফাইলের')}
if(ex)Object.assign(ex,{name:m.name,dob:m.dob,target:m.target,photo:m.photo});else S.members.push(m);PMK.forEach(k=>{S[k]=S[k].filter(x=>x.m!=m.id).concat((d.rows&&d.rows[k])||[])});
if(d.shared){GLK.forEach(k=>{if(d.shared[k])S[k]=d.shared[k]});if(d.shared.opts)S.opts=d.shared.opts}
save();log(ex?'✅ ব্যাকআপ রিস্টোর সফল হয়েছে':'✅ প্রোফাইল "'+m.name+'" যোগ হয়েছে — লক স্ক্রিন থেকে তার PIN দিয়ে ঢুকুন');render()}
else if(d.members){const L2=fix(d);L2.members.forEach(m=>{if(S.members.find(x=>x.id==m.id))return;S.members.push(m);PMK.forEach(k=>{S[k]=S[k].concat((L2[k]||[]).filter(x=>x.m==m.id))})});save();log('✅ পুরনো ব্যাকআপ থেকে নতুন প্রোফাইল যোগ হয়েছে (PIN সেট করতে লক স্ক্রিনে ঢুকুন)');render()}else throw 0}catch(e){log('❌ রিস্টোর ব্যর্থ: ফাইলটি সঠিক ব্যাকআপ নয়');alert('ফাইলটি সঠিক ব্যাকআপ নয়')}};r.readAsText(f)}
/* Google Drive / Sheet */
const ttl=k=>{const l=L(k),sp=l.indexOf(' ');return((l.charCodeAt(0)>8192&&sp>0)?l.slice(sp+1):l).replace(/[\[\]*?:\/\\]/g,'')};
function post(o){return fetch(S.set.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)}).then(r=>r.json())}
function expCols(k){if(k=='lipid'){const f=v=>v==null?'':(+v).toFixed(1);return[['তারিখ',r=>r.date],['TC (mg/dL)',r=>f(r.tc)],['TG (mg/dL)',r=>f(r.tg)],['HDL (mg/dL)',r=>f(r.hdl)],['LDL (mg/dL)',r=>f(r.ldl)],['VLDL (mg/dL)',r=>f(r.vldl)],['TC/HDL',r=>r.hdl?(r.tc/r.hdl).toFixed(2):''],['TG/HDL',r=>r.hdl?(r.tg/r.hdl).toFixed(2):''],['নোট',r=>r.note]]}
const o=[];F[k].forEach(f=>{if(f[2]=='photos')return;if(f[2]=='vals')o.push(['রেজাল্ট',r=>resText(k,r)]);else o.push([f[1],r=>r[f[0]]])});
const X={sugar:[['HOMA-IR',r=>{const h=homa(r);return h?h.toFixed(2):''}]],dsug:[['পার্থক্য (পরে − আগে)',r=>{const a=parseFloat(r.bf),b=parseFloat(r.af);return isNaN(a)||isNaN(b)?'':(b-a).toFixed(1)}]],doc:[['টোটাল খরচ',r=>(+r.mc||0)+(+r.tc||0)]],body:[['BMI',r=>bmi(r)]]};return o.concat(X[k]||[])}
function tblExp(k,mid){const rows=S[k].filter(r=>mid?r.m==mid:true),cols=expCols(k),ky=r=>(r.date||'')+(r.time||r.st||'');rows.sort((a,b)=>ky(a).localeCompare(ky(b)));
return{title:ttl(k),cols:cols.map(c=>c[0]),rows:rows.map(r=>cols.map(c=>{const v=c[1](r);return v==null?'':String(v)})),photos:rows.map(r=>(r.photos&&r.photos.length)?(r.pl||[]):[])}}
function memberBackup(m){const rows={};PMK.forEach(k=>{rows[k]=S[k].filter(r=>r.m==m.id).map(r=>{const c=Object.assign({},r);c.pn=(r.photos||[]).length;delete c.photos;return c})});return{v:2,member:{id:m.id,name:m.name,dob:m.dob||'',target:m.target||null},rows:rows}}
const psig=r=>(r.photos||[]).map(p=>p.length).join(',');
function uploadPhotos(m){const jobs=[];PMK.forEach(k=>S[k].forEach(r=>{if(r.m==m.id&&r.photos&&r.photos.length&&r.pus!=psig(r))jobs.push([k,r])}));let n=0;const tot=jobs.reduce((a,j)=>a+j[1].photos.length,0);
return jobs.reduce((pr,j)=>pr.then(()=>{const k=j[0],r=j[1];r.pl=[];let q=Promise.resolve();r.photos.forEach((p,i)=>{q=q.then(()=>post({action:'photo',folder:S.set.folder,member:{id:m.id,name:m.name},card:ttl(k),name:(r.date||'nodate')+'_'+r.id+'_'+(i+1)+'_'+p.length+'.jpg',data:p.split(',')[1]})).then(x=>{if(!x.ok)throw new Error(x.error||'ছবি আপলোড ব্যর্থ');r.pl.push(x.url);n++;setSync('ছবি আপলোড '+n+'/'+tot,'wait')})});return q.then(()=>{r.pus=psig(r);save()})}),Promise.resolve())}
function syncNow(auto){const ue=$('#ur');if(ue)S.set.url=ue.value.trim();if(!S.set.url){setSync('URL দেওয়া হয়নি','err');log('❌ সিঙ্ক হয়নি: Apps Script URL নেই');return}if(syncing)return;if(!auto){if(!navigator.onLine){log('❌ ইন্টারনেট নেই — নেট এলে আবার চেষ্টা করুন');return setSync('অফলাইন','err')}if(netType()=='cellular'&&!confirm('আপনি এখন মোবাইল ডাটায় আছেন। তবুও পাঠাবেন?'))return}syncing=true;const m=me(),folder=S.set.folder;m.dirty=false;setSync('পাঠানো হচ্ছে…','wait');log('⏳ ডাটা পাঠানো শুরু ('+m.name+')');
uploadPhotos(m).then(()=>post({action:'push',folder:folder,member:{id:m.id,name:m.name},backup:memberBackup(m),tables:PMK.map(k=>tblExp(k,m.id))})).then(j=>{if(!j.ok)throw new Error(j.error||'অজানা ত্রুটি');return post({action:'push',folder:folder,member:{id:'shared',name:'শেয়ার্ড তথ্য (সবার জন্য)'},tables:GLK.map(k=>tblExp(k))})}).then(j=>{if(!j.ok)throw new Error(j.error||'অজানা ত্রুটি');S.set.last=now();save();setSync('পাঠানো সম্পন্ন · '+S.set.last,'ok');log('✅ '+m.name+'-এর ডাটা Google Sheet ও Drive-এ পাঠানো হয়েছে → ফোল্ডার: '+folder)}).catch(e=>{m.dirty=true;save();setSync('ব্যর্থ — পরে আবার চেষ্টা হবে','err');log('❌ সিঙ্ক ব্যর্থ: '+e.message+' — URL, ডিপ্লয়ের Access "Anyone" ও Code.gs-এর অনুমতি দেখুন')}).then(()=>{syncing=false})}
function pullNow(){const ue=$('#ur');if(ue)S.set.url=ue.value.trim();if(!S.set.url){setSync('URL দেওয়া হয়নি','err');log('❌ ডাটা আনা যায়নি: URL নেই');return}
setSync('আনা হচ্ছে…','wait');log('⏳ Google Drive থেকে '+me().name+'-এর ডাটা আনা শুরু');
fetch(S.set.url+(S.set.url.indexOf('?')>-1?'&':'?')+'action=pull&folder='+encodeURIComponent(S.set.folder)+'&member='+encodeURIComponent(cur)+'&name='+encodeURIComponent(me().name)).then(r=>r.json()).then(j=>{if(!j.ok||!j.data)throw new Error(j.error||'ডাটা পাওয়া যায়নি');
if(!confirm('এই প্রোফাইলের বর্তমান ডাটা Google Drive-এর ব্যাকআপ দিয়ে বদলে যাবে (ছবি এই ডিভাইসেই থাকবে)। চালিয়ে যাবেন?')){setSync('বাতিল','wait');return}
const d=j.data,m=me();m.dob=d.member.dob||m.dob;m.target=d.member.target||m.target;PMK.forEach(k=>{const old={};S[k].filter(r=>r.m==m.id).forEach(r=>{old[r.id]=r});S[k]=S[k].filter(r=>r.m!=m.id).concat(((d.rows||{})[k]||[]).map(r=>{r.m=m.id;if(old[r.id]&&old[r.id].photos){r.photos=old[r.id].photos;r.pl=old[r.id].pl;r.pus=old[r.id].pus}delete r.pn;return r}))});
S.set.last=now();save();setSync('আনা সম্পন্ন · '+S.set.last,'ok');log('✅ Google Drive থেকে ডাটা এসেছে');render()}).catch(e=>{setSync('ব্যর্থ','err');log('❌ ডাটা আনা ব্যর্থ: '+e.message)})}
function memberSync(m){if(!S.set.url)return;post({action:'member',folder:S.set.folder,member:{id:m.id,name:m.name}}).then(j=>{if(!j.ok)throw new Error(j.error);delete m.needFolder;save();log('📁 ড্রাইভে '+m.name+'-এর ফোল্ডার ও শিট তৈরি হয়েছে')}).catch(e=>log('❌ '+m.name+'-এর ফোল্ডার তৈরি হয়নি: '+e.message))}
function saveSet(){S.set.folder=$('#fd').value.trim()||'Family_Health_DB';S.set.url=$('#ur').value.trim();save();log('✅ সেটিং সংরক্ষণ হয়েছে — ফোল্ডার: '+S.set.folder);setSync('সেটিং সংরক্ষিত','ok');
if(S.set.url){log('⏳ ড্রাইভে ফোল্ডার তৈরি হচ্ছে…');post({action:'folder',folder:S.set.folder}).then(j=>{if(!j.ok)throw new Error(j.error);log('📁 ড্রাইভে ফোল্ডার তৈরি/পাওয়া গেছে: '+S.set.folder);memberSync(me())}).catch(e=>log('❌ ফোল্ডার তৈরি হয়নি: '+e.message))}}
function testConn(){const ue=$('#ur');if(ue)S.set.url=ue.value.trim();const u=S.set.url;if(!u){log('❌ টেস্ট ব্যর্থ: Apps Script URL দেওয়া হয়নি');return setSync('URL দেওয়া হয়নি','err')}
setSync('কানেকশন টেস্ট চলছে…','wait');log('⏳ কানেকশন টেস্ট চলছে…');
fetch(u+(u.indexOf('?')>-1?'&':'?')+'action=ping').then(r=>r.json()).then(j=>{if(!j||!j.ok)throw new Error('সঠিক উত্তর আসেনি');S.set.last=now();save();setSync('কানেকশন ঠিক আছে · '+S.set.last,'ok');log('✅ Google-এর সাথে কানেকশন ঠিক আছে'+(j.user?' (অ্যাকাউন্ট: '+j.user+')':''))}).catch(e=>{setSync('কানেকশন হয়নি','err');log('❌ কানেকশন হয়নি: '+e.message+' — URL ঠিক আছে কিনা এবং ডিপ্লয়ের Access "Anyone" কিনা দেখুন')})}

/* ===== অফলাইন (PWA), নেটওয়ার্ক অবস্থা, ইনস্টল ===== */
function netChk(){pendBadge();const e=$('#netst');if(!e)return;const ty={wifi:'Wi-Fi / ওয়্যার্ড',cellular:'মোবাইল ডাটা',unknown:'অজানা'}[netType()],ok=navigator.onLine;

if(navigator.storage&&navigator.storage.persisted)navigator.storage.persisted().then(draw,()=>draw(null));else draw(null)}
